apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: howwasread-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pbonard/howwasread-backend.git
    targetRevision: main
    path: k8s/helm
    helm:
      releaseName: howwasread-backend
  destination:
    server: https://kubernetes.default.svc
    namespace: backend
  syncPolicy:
    automated:
      selfHeal: false
      prune: false
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
