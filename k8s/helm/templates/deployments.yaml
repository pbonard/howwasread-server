{{- range $name, $app := .Values.apps }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $name }}
spec:
  # replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        framework: {{ $app.framework | default "none" }}
    spec:
      {{- if hasPrefix "ghcr.io/" $.Values.registry }}
      imagePullSecrets:
        - name: ghcr
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.registry }}/{{ $app.image }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ $app.port }}
{{/*          resources:*/}}
{{/*            requests:*/}}
{{/*              cpu: {{ $app.cpuRequests }}*/}}
{{/*              memory: {{ $app.memoryRequests }}*/}}
{{/*            limits:*/}}
{{/*              cpu: {{ $app.cpuLimits }}*/}}
{{/*              memory: {{ $app.memoryLimits }}*/}}
          env:
            {{- if $app.valkey }}
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-user
                  key: lule
            {{- end}}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - configMapRef:
                name: config-map
            {{- if $app.mysql }}
            - secretRef:
                name: mysql
            {{- end }}
            {{- if $app.opensearch }}
            - secretRef:
                name: opensearch-backend-user
            {{- end }}
          volumeMounts:
            {{- if $app.kafka }}
            - name: kafka-user
              mountPath: "/cert/kafka/user"
              readOnly: true
            - name: kafka-ca
              mountPath: "/cert/kafka/cluster"
              readOnly: true
            {{- end }}
            {{- if $app.valkey }}
            - name: valkey-cert-volume
              mountPath: "/cert/valkey"
              readOnly: true
            {{- end }}
      volumes:
        {{- if $app.kafka }}
        - name: kafka-user
          secret:
            secretName: kafka-user
        - name: kafka-ca
          secret:
            secretName: kafka-cluster-cluster-ca-cert
        {{- end }}
        {{- if $app.valkey }}
        - name: valkey-cert-volume
          secret:
            secretName: valkey-cert
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - protocol: TCP
      port: 80
      targetPort: {{ $app.port }}

