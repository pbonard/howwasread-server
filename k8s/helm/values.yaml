namespace: backend
email: ""
registry: "ghcr.io/pbonard"

circuitBreaker:
  maxConnections: 100
  consecutiveErrors: 5
  baseEjectionTime: 30s
  maxPendingRequests: 100 # Limits requests waiting in the queue
  maxParallelRequests: 100 # Limits active, concurrent HTTP requests

apps:
  onlineconversation:
    image: "backend/onlineconversation:333f407"
    port: 8080
    routePath: /onlineconversation
    kafka: true
    mysql: true
    # its calls (websocket, valkey keys, turn credentials) are my-server's chat's
    valkey: false
    opensearch: true
#    cpuRequests: "0.03"
#    memoryRequests: "10Mi"
#    cpuLimits: "0.1"
#    memoryLimits: "10Mi"
  offlineconversation:
    image: "backend/offlineconversation:333f407"
    port: 8080
    routePath: /offlineconversation
    kafka: true
    mysql: true
    valkey: true
    opensearch: false
    framework: spring-boot
    # without -Xmx the default max heap is a quarter of the node, about 7 GiB
    javaOptions: "-Xmx256m -XX:+ExitOnOutOfMemoryError"
    memoryRequests: "512Mi"
    memoryLimits: "640Mi"
